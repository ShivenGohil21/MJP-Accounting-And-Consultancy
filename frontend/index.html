<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MJP Society Accounts & Consultancy - Professional Co-op Housing, Industrial, and Credit Society management services since 2005. Specialized in society accounting, statutory registers, bye-laws, tax filings, and committee elections." />
    <meta name="keywords" content="society accounting, housing society management, statutory registers, I register, J register, model bye-laws, society registration, IT return, GST, TDS, cooperative housing society, Mumbai, Kandivali" />
    <title>MJP Society Accounts & Consultancy | Professional Society Management & Accounting Services</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Symbols for Design2.0 Visual Elements -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  </head>
  <body class="bg-background text-on-background antialiased font-sans">
    <div id="root">
      <!-- Clean Minimal Blurred HTML Loader for Deployed Environments -->
      <div style="position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.75); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); z-index: 9999; padding: 24px; text-align: center;">
        <div style="padding: 16px; background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(12px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 10px 30px rgba(0,0,0,0.06); margin-bottom: 20px;">
          <img src="/mjp_logo.png" alt="MJP Logo" style="height: 72px; width: auto; object-fit: contain;" />
        </div>
        <div style="display: flex; gap: 8px; align-items: center; justify-content: center;">
          <span style="width: 10px; height: 10px; background-color: #1e3a8a; border-radius: 50%; display: inline-block; animation: mjpPulse 1.4s ease-in-out infinite both;"></span>
          <span style="width: 10px; height: 10px; background-color: #1e3a8a; border-radius: 50%; display: inline-block; animation: mjpPulse 1.4s ease-in-out 0.2s infinite both;"></span>
          <span style="width: 10px; height: 10px; background-color: #1e3a8a; border-radius: 50%; display: inline-block; animation: mjpPulse 1.4s ease-in-out 0.4s infinite both;"></span>
        </div>
        <style>
          @keyframes mjpPulse { 0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; } 40% { transform: scale(1); opacity: 1; } }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
